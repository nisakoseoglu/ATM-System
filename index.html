<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vion Bank ATM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="atm">
        <div class="atm-panel">

            <div class="screen-area">

                <div class="screen" id="screen">

                    <div class="demo-text">DEMO ATM</div>

                    <h2>VİON BANK</h2>
                    <p>Kartınızı takınız</p>

                </div>

                <div class="cash-slot">
                    <span>PARA ÇIKIŞI</span>

                    <div class="cash-hole">
                        <div class="cash-money" id="cash-money">💵</div>
                    </div>
                </div>

            </div>

            <div class="control-area">

                <div class="logo">VİON BANK</div>

                <div class="card-slot" id="card-slot">
                    <span>KART</span>

                    <div class="card-hole">
                        <div class="bank-card" id="bank-card"></div>
                    </div>
                </div>

                <div class="keypad">

                    <div class="number-pad">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>

                        <button>4</button>
                        <button>5</button>
                        <button>6</button>

                        <button>7</button>
                        <button>8</button>
                        <button>9</button>

                        <button>←</button>
                        <button>0</button>
                        <button>✓</button>
                    </div>

                    <div class="action-buttons">
                        <button class="cancel">İPTAL</button>
                        <button class="correct">DÜZELT</button>
                        <button class="confirm">ONAY</button>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
